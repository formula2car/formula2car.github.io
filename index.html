
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fórmula 2 | Gracias</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #061b40, #124b98);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 25px;
        }

        .contenedor {
            max-width: 650px;
            animation: entrada 1.5s ease;
        }

        .formula {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 8px;
        }

        .numero {
            font-size: 110px;
            font-weight: 900;
            line-height: 1.1;
        }

        .linea {
            width: 65px;
            height: 3px;
            background: #73b8ff;
            margin: 25px auto;
        }

        h1 {
            font-size: clamp(28px, 5vw, 40px);
            margin-bottom: 25px;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            color: #dce9ff;
        }

        .estado {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 22px;
            border: 1px solid #ffffff40;
            background: #ffffff12;
            border-radius: 30px;
            font-size: 14px;
        }

        footer {
            margin-top: 50px;
            font-size: 12px;
            letter-spacing: 3px;
            color: #b8d6ff;
        }

        @keyframes entrada {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <main class="contenedor">

        <div class="formula">FÓRMULA</div>
        <div class="numero">2</div>

        <div class="linea"></div>

        <h1>Gracias por ser parte de este proyecto</h1>

        <p>Nuestro periodo de campaña ha concluido.</p>

        <p>
            Agradecemos a todos nuestros compañeros
            por su tiempo, participación y confianza.
        </p>

        <div class="estado">
            Sitio temporalmente inactivo
        </div>

        <footer>FÓRMULA 2 | NOVIEMBRE 2026</footer>

    </main>
</body>
</html>
